# ABOUTME: System-level Codex defaults for the yolobox.
# ABOUTME: Baked into /etc/codex/config.toml by the Dockerfile.
#
# Keep only stable defaults here. Codex owns ~/.codex/config.toml and uses it
# for volatile state such as model choices, reasoning effort, project trust,
# and onboarding state. User config has higher precedence than this file, so a
# deliberate user preference still wins.

# Request workspace-write sandboxing with on-request approval. Network access
# defaults off but can be configured independently. These settings do not select
# automatic review: "Approve for me" also uses approvals_reviewer="auto_review".
# Recommend that reviewer in the user's ~/.codex/config.toml (see README.md);
# leave it as a user preference rather than setting it here. Launch with codex.
# The default posture is YOLO (firewall up, builtin seccomp), under which
# Bubblewrap cannot set up and these sandboxed defaults fail; use the -yolo
# wrappers there. Sandboxed Codex needs unconfined seccomp (normie mode:
# bbcode --normie on the host) and native tool validation; automatic review
# alone did not provide reliable recovery from sandbox setup failures.
# See .devcontainer/README.md and docs/journal/0917c for the decision and limits.
# YOLO wrappers bypass both sandboxing and approvals explicitly and refuse to
# start unless the container firewall and Docker seccomp filter are active.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "context-remaining",
    "five-hour-limit",
    "weekly-limit",
]
animations = false
