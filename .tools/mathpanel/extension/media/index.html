<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; img-src 'none'; script-src 'nonce-{{nonce}}'; style-src-elem {{cspSource}} 'nonce-{{nonce}}'; style-src-attr 'unsafe-inline'; font-src {{cspSource}}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathPanel</title>
<link rel="stylesheet" href="{{katexCss}}">
<style nonce="{{nonce}}">
  html {
    font-size: var(--vscode-font-size, 13px);
  }
  body {
    font-family: var(--vscode-font-family, sans-serif);
    font-size: 108%;
    color: var(--vscode-editor-foreground);
    background: var(--vscode-editor-background);
    margin: 0;
    padding: 0.5em 1em 2em;
  }
  #status, #notice {
    font-style: italic;
    opacity: 0.8;
    padding: 0.3em 0;
  }
  #status:empty, #notice:empty { display: none; }
  #notice { color: var(--vscode-editorWarning-foreground, #c90); }
  article {
    margin: 0.8em 0;
    padding: 0.2em 0 0.2em 0.8em;
    border-left: 2px solid var(--vscode-panel-border, #888);
  }
  article.user {
    border: 2px solid var(--vscode-charts-blue, #47f);
    border-radius: 4px;
    padding: 0.6em 0.8em;
    opacity: 0.85;
  }
  article header {
    font-size: 0.85em;
    opacity: 0.65;
    margin-bottom: 0.25em;
  }
  .message-body { white-space: pre-wrap; overflow-wrap: break-word; }
  .math.display { margin: 0.4em 0; overflow-x: auto; }
  .katex { font-size: 1.1em; }
  .message-body h1, .message-body h2, .message-body h3,
  .message-body h4, .message-body h5, .message-body h6 {
    margin: 0.7em 0 0.35em;
    line-height: 1.25;
  }
  .message-body h1 { font-size: 1.45em; }
  .message-body h2 { font-size: 1.3em; }
  .message-body h3 { font-size: 1.18em; }
  .message-body h4, .message-body h5, .message-body h6 { font-size: 1.08em; }
  .md-paragraph { margin: 0.4em 0; }
  .message-body ul, .message-body ol {
    margin: 0.4em 0;
    padding-left: 1.8em;
  }
  .message-body li { margin: 0.15em 0; }
  .message-body blockquote {
    margin: 0.5em 0;
    padding: 0.1em 0 0.1em 0.8em;
    border-left: 3px solid var(--vscode-textBlockQuote-border, #888);
    color: var(--vscode-textBlockQuote-foreground, var(--vscode-foreground));
    background: var(--vscode-textBlockQuote-background, transparent);
  }
  .message-body pre {
    overflow-x: auto;
    margin: 0.5em 0;
    padding: 0.6em 0.8em;
    border-radius: 3px;
    background: var(--vscode-textCodeBlock-background, rgba(127, 127, 127, 0.12));
    white-space: pre-wrap;
  }
  .message-body code {
    padding: 0.05em 0.25em;
    border-radius: 3px;
    font-family: var(--vscode-editor-font-family, monospace);
    background: var(--vscode-textCodeBlock-background, rgba(127, 127, 127, 0.12));
  }
  .message-body pre code { padding: 0; background: transparent; }
  .message-body hr {
    height: 1px;
    margin: 0.8em 0;
    border: 0;
    background: var(--vscode-panel-border, #888);
  }
  #turn-index {
    position: fixed;
    z-index: 1;
    top: 0.6em;
    right: 0.6em;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 1.2em);
    overflow-y: auto;
    border: 1px solid var(--vscode-panel-border, #888);
    border-radius: 4px;
    background: var(--vscode-editorWidget-background, var(--vscode-editor-background));
    opacity: 0.65;
  }
  #turn-index:hover, #turn-index:focus-within { opacity: 1; }
  #turn-index:empty { display: none; }
  #turn-index button {
    min-width: 1.6em;
    padding: 0.15em 0.35em;
    border: 0;
    color: var(--vscode-foreground);
    background: transparent;
    font: inherit;
    font-size: 0.75em;
    line-height: 1.2;
    cursor: pointer;
  }
  #turn-index button:hover, #turn-index button:focus {
    color: var(--vscode-list-activeSelectionForeground);
    background: var(--vscode-list-activeSelectionBackground);
    outline: none;
  }
</style>
</head>
<body>
<div id="status"></div>
<div id="notice"></div>
<nav id="turn-index" aria-label="User turns"></nav>
<main id="log"></main>
<script nonce="{{nonce}}" src="{{katexJs}}"></script>
<script nonce="{{nonce}}" src="{{markdownJs}}"></script>
<script nonce="{{nonce}}">
(function () {
  'use strict';
  var vscodeApi = acquireVsCodeApi();
  var log = document.getElementById('log');
  var statusEl = document.getElementById('status');
  var noticeEl = document.getElementById('notice');
  var turnIndexEl = document.getElementById('turn-index');

  function validSpan(s) {
    if (!s || typeof s !== 'object' || typeof s.s !== 'string') return false;
    if (s.t === 'text') return true;
    if (s.t === 'math') return s.m === 'inline' || s.m === 'display';
    return false;
  }
  function validEntry(e) {
    return !!e && typeof e === 'object'
      && (e.role === 'assistant' || e.role === 'user')
      && typeof e.tsDisplay === 'string'
      && Array.isArray(e.spans) && e.spans.every(validSpan);
  }

  function appendInlineText(parent, text) {
    var pattern = /(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*)/g;
    var from = 0;
    var match;
    while ((match = pattern.exec(text)) !== null) {
      if (match.index > from) parent.appendChild(document.createTextNode(text.slice(from, match.index)));
      var source = match[0];
      var tag = source[0] === '`'
        ? 'code'
        : source.slice(0, 2) === '**' || source.slice(0, 2) === '__' ? 'strong' : 'em';
      var width = tag === 'em' || tag === 'code' ? 1 : 2;
      var inline = document.createElement(tag);
      inline.textContent = source.slice(width, -width);
      parent.appendChild(inline);
      from = pattern.lastIndex;
    }
    if (from < text.length) parent.appendChild(document.createTextNode(text.slice(from)));
  }

  function appendMath(parent, span) {
    var el = document.createElement(span.m === 'display' ? 'div' : 'span');
    el.className = 'math ' + span.m;
    try {
      katex.render(span.s, el, {
        displayMode: span.m === 'display',
        throwOnError: false,
        trust: false,
        maxExpand: 1000,
        maxSize: 20
      });
    } catch (err) {
      el.textContent = span.s;
    }
    parent.appendChild(el);
  }

  function appendTokens(parent, tokens) {
    for (var i = 0; i < tokens.length; i++) {
      var token = tokens[i];
      if (token.t === 'text') appendInlineText(parent, token.s);
      else appendMath(parent, token);
    }
  }

  function appendLines(parent, lines) {
    for (var i = 0; i < lines.length; i++) {
      if (i > 0) parent.appendChild(document.createElement('br'));
      appendTokens(parent, lines[i]);
    }
  }

  function renderMarkdown(parent, spans) {
    var blocks = MathPanelMarkdown.parse(spans);
    for (var i = 0; i < blocks.length; i++) {
      var block = blocks[i];
      var el;
      if (block.type === 'heading') {
        el = document.createElement('h' + block.level);
        appendTokens(el, block.content);
      } else if (block.type === 'list') {
        el = document.createElement(block.ordered ? 'ol' : 'ul');
        for (var j = 0; j < block.items.length; j++) {
          var item = document.createElement('li');
          appendTokens(item, block.items[j]);
          el.appendChild(item);
        }
      } else if (block.type === 'blockquote') {
        el = document.createElement('blockquote');
        appendLines(el, block.lines);
      } else if (block.type === 'code') {
        el = document.createElement('pre');
        var code = document.createElement('code');
        code.textContent = block.text;
        el.appendChild(code);
      } else if (block.type === 'rule') {
        el = document.createElement('hr');
      } else {
        el = document.createElement('div');
        el.className = 'md-paragraph';
        appendLines(el, block.lines);
      }
      parent.appendChild(el);
    }
  }

  // Prose is assigned with textContent or text nodes; only math source reaches KaTeX.
  function render(msg) {
    statusEl.textContent = typeof msg.status === 'string' ? msg.status : '';
    noticeEl.textContent = typeof msg.notice === 'string' ? msg.notice : '';
    var atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
    log.replaceChildren();
    turnIndexEl.replaceChildren();
    var entries = Array.isArray(msg.entries) ? msg.entries : [];
    var turnNumber = 0;
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      if (!validEntry(e)) continue;
      var art = document.createElement('article');
      art.className = e.role;
      if (e.role === 'user') {
        turnNumber++;
        art.id = 'user-turn-' + turnNumber;
        var turnButton = document.createElement('button');
        turnButton.type = 'button';
        turnButton.textContent = String(turnNumber);
        turnButton.title = 'Go to user turn ' + turnNumber;
        turnButton.setAttribute('aria-label', turnButton.title);
        turnButton.dataset.target = art.id;
        turnIndexEl.appendChild(turnButton);
      }
      var head = document.createElement('header');
      head.textContent = (e.role === 'user' ? '==== You ====' : '==== Agent Response ====') + (e.tsDisplay ? ' · ' + e.tsDisplay : '');
      art.appendChild(head);
      var body = document.createElement('div');
      body.className = 'message-body';
      renderMarkdown(body, e.spans);
      art.appendChild(body);
      log.appendChild(art);
    }
    if (atBottom) window.scrollTo(0, document.body.scrollHeight);
  }

  turnIndexEl.addEventListener('click', function (ev) {
    var button = ev.target.closest('button[data-target]');
    if (!button || !turnIndexEl.contains(button)) return;
    var target = document.getElementById(button.dataset.target);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (m && m.type === 'replaceHistory') render(m);
  });
  vscodeApi.postMessage({ type: 'ready' });
})();
</script>
</body>
</html>
