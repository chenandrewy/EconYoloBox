# Big Sandbox settings
# Use `bbox --rebuild` after editing.

## Security Posture
# `internet` access; `packages` access; `seccomp` system call filter
#
# For YOLO mode: use "firewalled", "readonly", "builtin"
# For normie mode: use "open", "writable", "unconfined"

internet = "firewalled"
packages = "readonly"
seccomp = "builtin"

## Container paths. 
# The SANDBOX-AGENTS.md 
cellar = "/sandbox/cellar/" # research library
done = "/sandbox/done/" # completed projects
screenshot_directory = "/sandbox/workspace/dev/screenshots/"

# Comment out to use the host's detected zone.
timezone = "America/New_York"
