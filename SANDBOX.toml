# Big Sandbox settings
#
# The security posture is not set here. It is chosen on the host when bbox
# creates the container: bbcode or bbe for YOLO mode (the default), bbcode
# --normie or bbe --normie for normie mode. See README.md.

## Container paths.
# The SANDBOX-AGENTS.md
cellar = "/sandbox/cellar/" # research library
done = "/sandbox/done/" # completed projects
screenshot_directory = "/sandbox/workspace/dev/screenshots/"

# Comment out to use the host's detected zone.
timezone = "America/New_York"
