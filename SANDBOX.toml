# Big Sandbox settings
# Rebuild after editing

# true raises the deny-by-default egress firewall at container start
# false skips the firewall setup.
firewall = false

# IANA zone for TZ and for human-facing timestamps. Comment out to use the
# host's detected zone.
timezone = "America/New_York"

# Container paths. Agents read these directly.
research_library = "/workspace/LIBRARY/"
screenshot_directory = "/workspace/dev/screenshots/"

# Heads up: seccomp is toggled in .devcontainer/devcontainer.json, not in this file.
# seccomp = "unconfined" is selected for Bubblewrap compatibility.
# It removes Docker's outer syscall filter for every container process.
# Builtin currently blocks sandbox setup; automatic review cannot repair it.
# Recreate the container, then validate native execution and editing.
# See .devcontainer/README.md for validation checks and the security tradeoff.
