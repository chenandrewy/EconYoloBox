# Big Sandbox settings

## Security 
# YOLO launchers require both firewall = true and seccomp = "builtin"
# Codex auto mode works more smoothly with seccomp = "unconfined"

# `firewall = true` raises the deny-by-default firewall
# `firewall = false` leaves internet access open
firewall = true

## Docker's system call filter
# `seccomp = "builtin"` uses Docker's default protections
# `seccomp = "unconfined"` allows Codex's bubblewrap sandboxing
seccomp = "builtin"

## Container paths. 
# The SANDBOX-AGENTS.md points to these paths
cellar = "/sandbox/cellar/"
# Finished and retired projects. Moving a project here means it is no longer
# active work; workspace/ holds only what is in progress.
done = "/sandbox/done/"
screenshot_directory = "/sandbox/workspace/dev/screenshots/"

# IANA zone for TZ and for human-facing timestamps. Comment out to use the
# host's detected zone.
timezone = "America/New_York"
