# Big Sandbox settings
# Rebuild after editing
#
# The checked-in values are the YOLO posture: firewall up and Docker's builtin
# seccomp filter, so the -yolo launchers start. For internet access, set
# firewall = false and use Claude's auto mode. Codex's sandboxed modes need
# seccomp = "unconfined" (Bubblewrap); see README.md.

# Docker seccomp is fixed when the container is created. Direct VS Code builds
# use unconfined; apply this setting with `bbox --rebuild` on the host.
# unconfined enables Codex/Bubblewrap, but removes Docker's outer syscall filter
# from every container process. `builtin` keeps Docker's standard filter.
seccomp = "builtin"

# true raises the deny-by-default egress firewall at container start
# false skips the firewall setup.
firewall = true

# IANA zone for TZ and for human-facing timestamps. Comment out to use the
# host's detected zone.
timezone = "America/New_York"

# Container paths. Agents read these directly.
# The cellar is the research library: PDFs of papers, drafts, and other
# reference material. "Look in the cellar for the Azoulay paper" means here.
# It is shared reference material, not a project, so it sits beside
# workspace/ at the sandbox root.
cellar = "/sandbox/cellar/"
screenshot_directory = "/sandbox/workspace/dev/screenshots/"
