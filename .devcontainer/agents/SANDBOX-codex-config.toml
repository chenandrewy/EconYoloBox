# ABOUTME: System-level Codex defaults for the sandbox.
# ABOUTME: Baked into /etc/codex/config.toml by the Dockerfile.
#
# Keep only stable defaults here. Codex owns ~/.codex/config.toml and uses it
# for volatile state such as model choices, reasoning effort, project trust,
# and onboarding state. User config has higher precedence than this file, so a
# deliberate user preference still wins.

# "Approve for me" posture as the container default: the model asks before
# acting (on-request) and shell commands run in Codex's workspace-write sandbox
# with network off. Network-off is enforced by bubblewrap's --unshare-net, which
# only works because devcontainer.json relaxes Docker's seccomp filter - without
# that, bwrap can't build its namespaces and codex errors instead of running
# (see docs/journal/0915b, 0915d). Codex's own default is read-only, so this is
# what upgrades a bare `codex` to a useful-but-sandboxed session. YOLO
# (gptchat-yolo) still bypasses both axes explicitly.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "context-remaining",
    "five-hour-limit",
    "weekly-limit",
]
animations = false